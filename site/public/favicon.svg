<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Znak Preving Pro: prepreka sa trakom upozorenja, uproscena da se cita na 16px.
         Tamna plocica je namerna, da znak ima kontrast i na svetloj i na tamnoj traci kartica. -->
    <defs>
        <pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="8" height="8" fill="#FECB0F"/>
            <rect width="4" height="8" fill="#0d0d0d"/>
        </pattern>
    </defs>
    <rect width="32" height="32" rx="6" fill="#0d0d0d"/>
    <rect x="9" y="14" width="4" height="12" fill="#cfccc3"/>
    <rect x="19" y="14" width="4" height="12" fill="#cfccc3"/>
    <rect x="7" y="24.5" width="8" height="3" rx="1" fill="#9b988f"/>
    <rect x="17" y="24.5" width="8" height="3" rx="1" fill="#9b988f"/>
    <rect x="2" y="4.5" width="28" height="10" rx="1.5" fill="url(#hz)"/>
</svg>
