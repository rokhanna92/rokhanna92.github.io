<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Traka upozorenja, ista sara kao dugme menija u zaglavlju:
         zuto i crno na 45 stepeni. Sara ide preko cele plocice jer se na 16px,
         koliko kartica stvarno daje, sitniji crtez pretvori u mrlju. -->
    <defs>
        <pattern id="hz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="12" height="12" fill="#FECB0F"/>
            <rect width="6" height="12" fill="#0d0d0d"/>
        </pattern>
    </defs>
    <rect width="32" height="32" rx="6" fill="url(#hz)"/>
</svg>
