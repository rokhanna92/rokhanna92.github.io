        description: "Ne vidi se na strani. Prikazuje se u kartici pretraživača i pri deljenju linka."
        type: object
        fields:
          - name: naslov
            label: "Naslov strane"
            type: string
            required: true
            options:
              maxlength: 70
          - name: opis
            label: "Opis strane"
            type: text
            required: true
            options:
              maxlength: 170
      - name: hero
        label: "Zaglavlje naslovne"
        type: object
        fields:
          - name: koordinate
            label: "Koordinate i mesto"
            description: "Sitan tekst gore levo, iznad naslova."
            type: string
            required: true
            options:
              maxlength: 60
          - name: linija
            label: "Oznaka dežurne linije"
            description: "Sitan tekst gore desno, pored žute tačke koja treperi."
            type: string
            required: true
            options:
              maxlength: 40
          - name: oznaka
            label: "Šifre usluga iznad naslova"
            description: "Na primer BZR_01 / ZOP_02 / KOORDINATOR_03 / OBUKE_04."
            type: string
            required: true
            options:
              maxlength: 80
          - name: naslovPre
