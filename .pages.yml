                    required: true
                    options:
                      maxlength: 60
                  - name: body
                    label: "Obrazloženje"
                    type: text
                    required: true
                    options:
                      maxlength: 500
                  - name: fine
                    label: "Prikaži rok i kaznu"
                    type: boolean
              - name: office
