# Pages CMS konfiguracija za Preving Pro
# Ovaj fajl stoji u korenu repozitorijuma, ne u site/. Putanje su od korena.
# Uređivači ga ne vide i ne mogu da ga menjaju.
#
# Napomena za održavaoca:
# settings.content.merge: true je obavezan. Bez njega Pages CMS pri svakom
# snimanju prepisuje ceo fajl samo onim poljima koja su navedena ispod, pa bi
# iz cenovnik.json nestali estimator.defaults, estimator.limits,
# estimator.labels, estimator.pausalOpts i estimator.checkboxes, a build bi pukao.
#
# Namerno se NE izlažu prices.json, price-chips.json i usluge.json: njihove cene
# su refovi na id iz cenovnik.json, pa bi ih uređivač samo pokvario. Isto važi za
# form-options.json. Sve cene se menjaju na jednom mestu, u Cenovniku ispod.

media:
  input: site/public
  output: /

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "cms: dodat {filename}"
      update: "cms: izmenjen {filename}"
      delete: "cms: obrisan {filename}"
      rename: "cms: preimenovan {oldFilename} u {newFilename}"

content:
  # ---------------------------------------------------------------
  # 1. CENOVNIK - jedini izvor cena na sajtu
  # ---------------------------------------------------------------
  - name: cenovnik
    label: "Cenovnik i kalkulator"
    description: "Tabela cena na strani Cenovnik i cene koje koristi kalkulator ponude. Ovo je jedino mesto na sajtu gde se cena menja."
    type: file
    path: site/src/data/cenovnik.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: groups
        label: "Grupe cenovnika"
        description: "Svaka grupa je jedna tabela na strani Cenovnik. Redosled grupa ovde je redosled na sajtu."
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{oznaka} · {naziv}"
        fields:
          - name: naziv
            label: "Naziv grupe"
            description: "Piše se velikim slovima, na primer MESEČNI PAKETI."
            type: string
            required: true
            options:
              maxlength: 60
          - name: oznaka
            label: "Oznaka grupe"
            description: "Šifra u obliku G-01, G-02 i tako redom. Mora biti jedinstvena i u nizu."
            type: string
            required: true
            pattern:
              regex: "^G-[0-9]{2}$"
              message: "Oznaka mora biti u obliku G-01."
            options:
              maxlength: 6
          - name: stavke
            label: "Stavke u grupi"
            description: "Redovi tabele. Mora postojati bar jedna stavka."
            type: object
            required: true
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{n} · {iznos}"
            fields:
              - name: id
                label: "Tehnička oznaka stavke"
                description: "Zaključana. Preko nje ostatak sajta pronalazi ovu cenu. Novu stavku i njenu oznaku upisuje programer, inače build pada."
                type: string
                readonly: true
                required: true
              - name: n
                label: "Naziv stavke"
                description: "Kratak naziv usluge, prikazuje se podebljano."
                type: string
                required: true
                options:
                  maxlength: 120
              - name: d
                label: "Opis stavke"
                description: "Jedan red sitnim slovima ispod naziva. Može ostati prazno."
                type: text
                options:
                  maxlength: 200
              - name: iznos
                label: "Iznos"
                description: "Samo broj, sa svojim „od\" ako ga ima. Primeri: 3.200, od 15.000, 4.000–7.000, na upit. Bez jedinice i bez oznake RSD."
                type: string
                required: true
                options:
                  maxlength: 40
              - name: jedinica
                label: "Jedinica mere"
                description: "Samo mera, uz kosu crtu. Primeri: / sat, / mes, / radniku, / aparatu. Ostavite prazno ako se cena ne meri po jedinici."
                type: string
                options:
                  maxlength: 24
      - name: note
        label: "Napomena ispod cenovnika"
        description: "Sitan tekst na dnu strane Cenovnik: valuta, PDV, period važenja."
        type: text
        required: true
        options:
          maxlength: 400
      - name: estimator
        label: "Kalkulator ponude"
        description: "Cene koje kalkulator množi. Svaka mora biti jednaka donjoj granici iznosa odgovarajuće stavke iznad, inače build pada sa porukom koja kaže koje dve vrednosti se ne slažu."
        type: object
        fields:
          - name: rates
            label: "Jedinične cene"
            description: "Sve vrednosti su celi brojevi u dinarima, bez tačke, razmaka i oznake valute. Na primer 8200, ne 8.200."
            type: object
            fields:
              - name: aktPoMestu
                label: "Akt o proceni rizika, po radnom mestu"
                type: number
                required: true
                options:
                  min: 100
                  max: 1000000
              - name: pravilnikBzr
                label: "Pravilnik o bezbednosti i zdravlju na radu"
                type: number
                required: true
                options:
                  min: 100
                  max: 1000000
              - name: pravilnikLzo
                label: "Pravilnik o ličnoj zaštitnoj opremi"
                type: number
                required: true
                options:
                  min: 100
                  max: 1000000
              - name: pravilaZop
                label: "Pravila zaštite od požara sa planom evakuacije"
                type: number
                required: true
                options:
                  min: 100
                  max: 1000000
              - name: obukaPoRadniku
                label: "Obuka, po radniku"
                type: number
                required: true
                options:
                  min: 100
                  max: 1000000
              - name: pausalOsnovni
                label: "Mesečni paušal, Osnovni paket"
                type: number
                required: true
                options:
                  min: 100
                  max: 1000000
              - name: pausalPro
                label: "Mesečni paušal, Pro paket"
                type: number
                required: true
                options:
                  min: 100
                  max: 1000000

  # ---------------------------------------------------------------
  # 2. NASLOVNA STRANA
  # ---------------------------------------------------------------
  - name: naslovna
