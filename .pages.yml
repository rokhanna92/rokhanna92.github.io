            options:
              maxlength: 20
          - name: uvod
            label: "Uvodni pasus"
            type: text
            required: true
            options:
              maxlength: 400
          - name: dugmePonuda
            label: "Natpis na žutom dugmetu"
            type: string
            required: true
            options:
              maxlength: 40
          - name: linkCenovnik
            label: "Natpis na linku ka cenovniku"
            type: string
            required: true
            options:
              maxlength: 40
          - name: panel
            label: "Tabla sa stanjem propisa"
            description: "Mali okvir desno od naslova. Ne vidi se na užim ekranima."
            type: object
            fields:
              - name: naslov
                label: "Naslov table"
                type: string
                required: true
                options:
                  maxlength: 30
              - name: zivo
                label: "Oznaka uživo"
                type: string
                required: true
                options:
                  maxlength: 20
              - name: redovi
                label: "Redovi table"
                type: object
                required: true
                list:
                  min: 1
                  max: 3
                  collapsible:
                    collapsed: true
                    summary: "{label} · {value}"
                fields:
                  - name: label
                    label: "Naziv reda"
                    type: string
                    required: true
                    options:
                      maxlength: 40
                  - name: value
                    label: "Vrednost desno"
                    description: "Ispisuje se žutom bojom, na primer NA SNAZI ili 01.01.2027."
                    type: string
