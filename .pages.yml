                    options:
                      maxlength: 20
          - name: traka
            label: "Žuta traka koja klizi"
            description: "Stavke se ispisuju u nizu, razdvojene kosom crtom koja se dodaje sama. Pišu se velikim slovima."
            type: string
            required: true
            list:
              min: 1
              collapsible: false
      - name: brojke
        label: "Traka sa brojkama"
        description: "Četiri polja ispod zaglavlja."
        type: object
        required: true
        list:
          min: 1
