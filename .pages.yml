                  - name: body
                    label: "Obrazloženje"
                    type: text
                    required: true
                    options:
                      maxlength: 500
                  - name: fine
                    label: "Prikaži rok i kaznu"
                    type: boolean
              - name: other
                label: "Nešto drugo"
                type: object
                fields:
                  - name: title
                    label: "Naslov rezultata"
                    type: string
                    required: true
                    options:
